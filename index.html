<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코오드 마케팅 플래너 2026–2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-2ExtraLight.woff2') format('woff2');font-weight:200;font-display:swap}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-3Light.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-4Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-5Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-6SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}
/* Khōde dashboard v9 — A2Z light/bold pairing, cream canvas, black sidebar, pastel blocks.
   Month view is the default and fits the screen: swipe / arrows / keyboard to change months. */
:root{
  --bg:#F7F4EF; --card:#FFFFFF; --soft:#FAF7F2; --ink:#161616; --ink2:#3E3B36; --muted:#8A857C; --line:#EFE9E0; --line2:#E2DACE;
  --blue:#234773; --blue-l:#E1E8F2; --orange:#F4CC9F; --peach:#F3DFCF; --mint:#D9E4E2; --greige:#D4D2C6; --hol:#C4622F;
  --sans:"A2z","Outfit","Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --num:"Outfit","A2z","Pretendard Variable",Pretendard,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.35,.5,1);
  --side:232px; --panel:320px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;font-weight:400;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.thin{font-weight:200}
.light{font-weight:300}

.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr) var(--panel);gap:18px;padding:18px;max-width:1760px;margin:0 auto;align-items:start}

/* ---------- sidebar ---------- */
.side{position:sticky;top:18px;height:calc(100vh - 36px);background:#161616;color:#E8E5DF;border-radius:24px;padding:22px 14px 16px;display:flex;flex-direction:column;overflow:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-weight:700;font-size:21px;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--blue);display:grid;place-items:center}
.logo i::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange)}
.logo small{font-family:var(--num);font-weight:300;font-size:12px;color:#8a867e;margin-left:auto}
.sh{font-size:11px;font-weight:300;letter-spacing:.06em;color:#86827a;padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;color:#BDB9B2;font-size:14px;font-weight:400;cursor:pointer;text-align:left;position:relative;transition:background .15s,color .15s,transform .12s}
.nav svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:#202020;color:#fff}
.nav:active{transform:scale(.97)}
.nav[aria-pressed="true"]{background:#262626;color:#fff;font-weight:600}
.nav[aria-pressed="true"]::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
.side-foot{margin-top:auto;padding:18px 12px 0;font-size:11px;font-weight:300;color:#7e7a73;line-height:1.6}

/* filter panel (sidebar + mobile sheet share markup) */
.fp{display:grid;gap:4px}
.sw-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:#1f1f1f;cursor:pointer;text-align:left;color:inherit;font-size:13.5px}
.sw-row .kd{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px rgba(244,204,159,.5)}
.sw-row b{font-weight:500}
.switch{margin-left:auto;width:34px;height:20px;border-radius:999px;background:#3a3a3a;position:relative;transition:background .2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s var(--spring)}
.sw-row[aria-checked="true"] .switch{background:#4a74b0}
.sw-row[aria-checked="true"] .switch::after{transform:translateX(14px)}
.grp{border-radius:12px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;cursor:pointer;border-radius:12px;transition:background .15s;user-select:none}
.grp-h:hover{background:#202020}
.grp-h .chev{width:16px;height:16px;stroke:#8a867e;fill:none;stroke-width:1.8;transition:transform .25s var(--ease);flex:0 0 auto}
.grp.open .grp-h .chev{transform:rotate(90deg)}
.grp-h .gl{font-size:13.5px;font-weight:500;flex:1}
.grp-h .cnt{font-family:var(--num);font-size:11.5px;font-weight:300;color:#8a867e}
.grp-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.grp.open .grp-b{grid-template-rows:1fr}
.grp-b>div{overflow:hidden;padding-left:12px}
.cb{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;color:#CFCBC4;font-size:13px;font-weight:300;transition:background .15s}
.cb:hover{background:#202020}
.box{width:16px;height:16px;border-radius:5px;border:1.5px solid #5a5650;display:grid;place-items:center;flex:0 0 auto;transition:background .15s,border-color .15s}
.box svg{width:11px;height:11px;stroke:#161616;stroke-width:3;fill:none;opacity:0;transition:opacity .15s}
[aria-checked="true"]>.box{background:var(--c,#E8E5DF);border-color:var(--c,#E8E5DF)}
[aria-checked="true"]>.box svg{opacity:1}
[aria-checked="mixed"]>.box{background:#E8E5DF;border-color:#E8E5DF}
[aria-checked="mixed"]>.box::after{content:"";width:8px;height:2px;border-radius:1px;background:#161616}
.cb .n{margin-left:auto;font-family:var(--num);font-size:11px;font-weight:300;color:#7e7a73}
.cb[aria-checked="true"]{color:#fff;font-weight:400}
.fp-actions{display:flex;gap:6px;padding:8px 12px 0}
.fp-actions button{flex:1;border:1px solid #333;background:none;border-radius:999px;padding:6px 0;font-size:12px;font-weight:300;color:#bdb9b2;cursor:pointer}
.fp-actions button:hover{border-color:#666;color:#fff}

/* ---------- main ---------- */
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:2px 2px 14px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-right:auto}
.top h1 .thin{letter-spacing:-.01em}
.todaychip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;font-size:12.5px;font-weight:300;color:var(--ink2)}
.todaychip b{font-weight:600;color:var(--ink)}
.btn{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:transform .12s,background .15s}
.btn:hover{background:#333}
.btn:active,.btn.down{transform:scale(.95)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;width:240px}
.search svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.6;flex:0 0 auto}
.search input{border:0;outline:0;background:none;width:100%;font-size:13.5px;font-weight:300}
.search input::placeholder{color:var(--muted)}
.view{animation:viewIn .3s var(--ease) backwards}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}

/* ---------- month view (fits the screen) ---------- */
.mbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 18px 18px;height:calc(100vh - 100px);min-height:600px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y}
.mhd{display:flex;align-items:center;gap:14px}
.mtitle{display:flex;align-items:baseline;gap:10px;min-width:0}
.mtitle .y{font-family:var(--num);font-weight:200;font-size:30px;letter-spacing:-.02em;color:var(--muted)}
.mtitle .m{font-family:var(--num);font-weight:600;font-size:34px;letter-spacing:-.04em;line-height:1}
.mtitle .m small{font-family:var(--sans);font-size:22px;font-weight:600;margin-left:1px}
.mtitle .kw{font-size:13px;font-weight:300;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mctl{margin-left:auto;display:flex;align-items:center;gap:6px}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;transition:transform .12s,background .15s}
.ib svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:var(--soft)}
.ib:active,.ib.down{transform:scale(.9)}
.ib:disabled{opacity:.3;pointer-events:none}
.pager{display:flex;gap:5px;align-items:center;padding:0 6px}
.pager button{width:7px;height:7px;border-radius:999px;border:0;padding:0;background:var(--line2);cursor:pointer;transition:width .3s var(--ease),background .2s}
.pager button[aria-current="true"]{width:22px;background:var(--ink)}
.pager button.has{background:#b7c6dc}
.pager button.has[aria-current="true"]{background:var(--ink)}
.calwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.calwrap.go-next{animation:inR .35s var(--ease)}
.calwrap.go-prev{animation:inL .35s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}}
.cal{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wdh{display:grid;grid-template-columns:repeat(7,1fr);background:var(--soft);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:300;color:var(--muted);text-align:center;padding:7px 0}
.wdh .sun{color:var(--hol)}
.weeks{flex:1;min-height:0;display:grid}
.wk{position:relative;border-bottom:1px solid var(--line);min-height:0}
.wk:last-child{border-bottom:0}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
.cell{position:relative;border:0;border-right:1px solid var(--line);background:none;padding:6px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-width:0;transition:background .15s}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--soft)}
.cell.out{background:var(--soft);cursor:default}
.cell .dh{display:flex;gap:6px;align-items:center;min-width:0}
.cell .dn{font-family:var(--num);font-size:13px;font-weight:400;color:var(--ink2);min-width:22px;height:22px;display:inline-grid;place-items:center}
.cell.sun .dn,.cell.hol .dn{color:var(--hol)}
.cell .hn{font-size:11px;font-weight:400;color:var(--hol);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .hn.c{color:var(--muted);font-weight:300}
.cell.today .dn{background:var(--ink);color:#fff;border-radius:50%;font-weight:600}
.cell.today::after{content:"TODAY";position:absolute;top:8px;right:8px;font-family:var(--num);font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--ink)}
.cell.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%,40%{background:#fde9d2}100%{background:transparent}}
.cell .more{align-self:flex-end;font-family:var(--num);font-size:10.5px;font-weight:400;color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;line-height:15px}
.bar{position:absolute;z-index:2;border:0;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:transform .15s,box-shadow .15s}
.bar:hover{transform:translateY(-1px);box-shadow:0 4px 12px -5px rgba(0,0,0,.28)}
.bar.kh{background:#C9D8EE;color:#1d3a60;font-weight:600;box-shadow:inset 3px 0 0 #5f7fae}
.bar.kh.tbd{background:repeating-linear-gradient(135deg,#D7E3F3 0 6px,#E6EDF7 6px 12px);border:1px dashed #7f9cc6;box-shadow:none}
.bar.kh .st{font-weight:400;opacity:.75;margin-left:4px;font-size:.92em}
.bar.big{background:var(--c);color:#2a2622}
.bar.big.irr{background:color-mix(in srgb,var(--c) 55%,#fff);color:#2a2622;border:1.5px dashed color-mix(in srgb,var(--c) 55%,#555)}
.bar.minor{background:color-mix(in srgb,var(--c) 45%,#fff);color:var(--ink2);font-weight:400;box-shadow:inset 3px 0 0 color-mix(in srgb,var(--c) 60%,#555)}
.bar.minor.irr{background:#fff;box-shadow:none;border:1px dashed color-mix(in srgb,var(--c) 55%,#555)}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.hint{font-size:11.5px;font-weight:300;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hint span{display:inline-flex;gap:6px;align-items:center}
.sw{width:18px;height:9px;border-radius:3px;display:inline-block}
.ld{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.hint .kbd{margin-left:auto}

/* ---------- year view: 12 tiles on one screen ---------- */
.ygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:12px;height:calc(100vh - 100px);min-height:620px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s}
.tile:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(0,0,0,.25)}
.tile.now{box-shadow:0 0 0 2px var(--ink)}
.tile .th{display:flex;align-items:baseline;gap:8px}
.tile .th b{font-family:var(--num);font-size:26px;font-weight:600;letter-spacing:-.04em;line-height:1}
.tile .th b small{font-family:var(--sans);font-size:16px}
.tile .th span{font-size:11.5px;font-weight:300;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tli{display:grid;gap:4px;min-height:0;overflow:hidden;mask-image:linear-gradient(#000 80%,transparent);-webkit-mask-image:linear-gradient(#000 80%,transparent)}
.tile .ti{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:300;min-width:0}
.tile .ti i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.tile .ti span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ti small{margin-left:auto;font-family:var(--num);font-size:11px;font-weight:300;color:var(--muted);flex:0 0 auto}
.tile .ti.k{font-weight:600;color:var(--blue)}
.tile .ti.b span{font-weight:500}
.tile .ti:not(.b):not(.k){color:var(--muted)}
.tile .tf{margin-top:auto;display:flex;gap:4px;align-items:center;font-size:11px;font-weight:300;color:var(--muted)}
.tile .heat{display:flex;gap:2px;margin-left:auto}
.tile .heat i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.tile .heat i.on{background:var(--orange)}

/* ---------- timeline ---------- */
.tl-tools{font-size:12px;font-weight:300;color:var(--muted);margin:0 2px 10px}
.tl-scroll{overflow:auto;-webkit-overflow-scrolling:touch;cursor:grab;border:1px solid var(--line);border-radius:24px;background:var(--card);max-height:calc(100vh - 130px)}
.tl-scroll.drag{cursor:grabbing;user-select:none}
.tl{min-width:1240px}
.tl-row{display:grid;grid-template-columns:118px minmax(0,1fr);border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-label{padding:8px 10px 8px 16px;font-weight:500;font-size:13px;position:sticky;left:0;background:var(--card);z-index:3;display:flex;align-items:center;border-right:1px solid var(--line)}
.tl-track{position:relative}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}
.months div{padding:10px 8px 8px;border-left:1px solid var(--line)}
.months b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.months small{display:block;color:var(--muted);font-size:11px;font-weight:300;line-height:1.35;margin-top:2px}
.grid-bg{position:absolute;inset:0;pointer-events:none}
.grid-bg .mline{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.grid-bg .hband{position:absolute;top:0;bottom:0;background:rgba(196,98,47,.06)}
.lane{position:relative;height:40px}
.ev{position:absolute;top:6px;height:30px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.ev .pill{display:block;height:9px;border-radius:5px;min-width:9px;transition:transform .2s var(--spring)}
.ev:hover .pill{transform:scaleY(1.4)}
.ev .nm{display:block;font-size:12.5px;font-weight:300;white-space:nowrap;margin-top:3px;line-height:1.25}
.ev.big .nm{font-weight:500}
.ev:not(.big) .nm{color:var(--muted)}
.ev .tip{position:absolute;left:0;top:-24px;background:var(--ink);color:#fff;font-family:var(--num);font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.ev:hover .tip,.ev:focus-visible .tip{opacity:1}
.hol-row .lane{height:24px}
.hol-tag{position:absolute;top:4px;font-size:11.5px;white-space:nowrap;color:var(--hol);font-weight:400}
.hol-tag.c{color:var(--muted);font-weight:300}
.sec-row{display:flex;align-items:baseline;gap:10px;padding:14px 16px 8px;border-bottom:1px solid var(--line);background:var(--soft)}
.sec-row .ko{font-size:13.5px;font-weight:600}
.sec-row .sub{font-size:11.5px;font-weight:300;color:var(--muted)}
.kh-row{background:#EEF3FA}
.kh-row .tl-label{background:#EEF3FA;color:var(--blue);flex-direction:column;align-items:flex-start;justify-content:center;font-size:15px;font-weight:700}
.kh-row .tl-label small{color:var(--muted);font-weight:300;font-size:11px}
.kh .pill{background:#9fb8dc!important}
.kh .nm{color:var(--blue)!important;font-weight:600!important;font-size:13px}
.kh .nm em{display:block;font-style:normal;font-weight:300;color:#4a5a70;font-size:11.5px}
.lane.kh-lane{height:58px}
.oyday{position:absolute;top:4px;height:6px;border-radius:3px}

/* ---------- right panel ---------- */
.panel{position:sticky;top:18px;max-height:calc(100vh - 36px);display:flex;flex-direction:column;gap:12px;min-height:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{position:relative;overflow:hidden;isolation:isolate;border-radius:20px;padding:14px 16px;display:grid;gap:4px}
.stat h3{margin:0;font-size:12px;font-weight:300}
.stat .big{font-family:var(--num);font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1.05}
.stat .big small{font-family:var(--sans);font-size:13px;font-weight:400;margin-left:2px;letter-spacing:0}
.stat .sub{font-size:11px;font-weight:300;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .sym{position:absolute;right:-2px;bottom:-22px;font-family:var(--num);font-weight:200;font-size:84px;line-height:1;opacity:.18;z-index:-1}

function wireFilters(root){

  root.querySelectorAll("[data-gh]").forEach(h=>{ const f=()=>{ const g=+h.dataset.gh; openGrp.has(g)?openGrp.delete(g):openGrp.add(g); h.parentElement.classList.toggle("open"); h.setAttribute("aria-expanded",openGrp.has(g)); };

function weeksHTML(o,MAX,HEAD,BH){
  const items=itemsFor(o.s,o.e), GAP=3; let h="";
  for(let ws=o.s-wdOf(o.s); ws<=o.e; ws+=7){
    const we=ws+6, a0=Math.max(ws,o.s), b0=Math.min(we,o.e);
    const wk=items.filter(x=>x.a<=b0&&x.b>=a0).map(x=>Object.assign({},x,{s:Math.max(x.a,a0),e:Math.min(x.b,b0)})).sort((p,q)=>p.pr-q.pr||p.s-q.s||(q.e-q.s)-(p.e-p.s));
    const lanes=[], hidden=new Array(7).fill(0);
    wk.forEach(x=>{ let l=lanes.findIndex(L=>L.every(z=>x.s>z.e||x.e<z.s)); if(l<0){ lanes.push([]); l=lanes.length-1; } if(l>=MAX){ x.l=-1; for(let d=x.s;d<=x.e;d++) hidden[d-ws]++; } else { lanes[l].push(x); x.l=l; } });
    h+=`<div class="wk"><div class="cells">`;
    for(let d=ws; d<=we; d++){

    }
    h+=`</div>`;
    wk.filter(x=>x.l>=0).forEach(x=>{ const c0=x.s-ws, span=x.e-x.s+1, bord=x.t.includes("irr")||x.t.includes("tbd");
      h+=`<button type="button" class="bar ${x.t} ${x.a<a0?"cl":""} ${x.b>b0?"cr":""}" ${x.attr} style="--c:${x.c};left:calc(${c0}/7*100% + 3px);width:calc(${span}/7*100% - 6px);top:${HEAD+x.l*(BH+GAP)}px;height:${BH}px;line-height:${BH-(bord?2:0)}px" title="${x.n} · ${x.sub}">${x.label||x.n}</button>`; });

}

function wireSwipe(box){

  box.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; t=Date.now(); },{passive:true});
  box.addEventListener("touchend",e=>{ const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Date.now()-t<700&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4) goMonth(cur+(dx<0?1:-1)); },{passive:true});

const pct=d=>((d-1)/TOT*100);
const mctx=document.createElement("canvas").getContext("2d");

function lanesFor(items,trackW,labelFn){
  const lanes=[];
  items.forEach(it=>{ const x0=pct(it.a)/100*trackW, x1=(pct(it.b)+100/TOT)/100*trackW, lw=labelFn(it)+10;
    let lx=x0; it._right=false; if(x0+lw>trackW){ lx=Math.max(0,x1-lw); it._right=true; }

  return lanes.length;
}

    ps.forEach(p=>{
      const occ=OCC.map((o,oi)=>Object.assign({oi},o)).filter(o=>DATA.ev[o.i].p===p.k&&occShow(o));
      const n=lanesFor(occ,trackW,o=>textW(DATA.ev[o.i].n,12.5,DATA.ev[o.i].big?500:300)), dark=`color-mix(in srgb,${p.c} 55%,#555)`;
      h+=`<div class="tl-row"><div class="tl-label">${mg(p.k)}<span style="margin-left:8px">${p.label}</span></div><div class="tl-track">${bgGrid()}`;
      if(p.k==="OY"&&oyShow()){ h+=`<div class="lane" style="height:14px">`; MONTHS.forEach(m=>h+=`<span class="oyday" title="올영데이 ${m.m}/25–27" style="left:${pct(m.s+24)}%;width:${3/TOT*100}%;background:${dark}"></span>`); h+=`</div>`; }
      for(let l=0;l<n;l++){ h+=`<div class="lane">`; occ.filter(o=>o._lane===l).forEach(o=>{ const e=DATA.ev[o.i];
        const fill=e.big?(e.reg?p.c:`color-mix(in srgb,${p.c} 60%,#fff)`):`color-mix(in srgb,${p.c} 45%,#fff)`, border=e.reg?`1px solid ${dark}`:`1.5px dashed ${dark}`;
        h+=`<button type="button" class="ev ${e.big?"big":""}" data-oc="${o.oi}" style="left:${pct(o.a)}%;width:${Math.max((o.b-o.a+1)/TOT*100,.25)}%"><span class="pill" style="background:${fill};border:${border}"></span><span class="nm" style="${o._right?"position:absolute;right:0":""}">${e.n}</span><span class="tip" style="${o._right?"left:auto;right:0":""}">${rngN(o.a,o.b)}${o.yr===2027?" · "+e.r26:""}</span></button>`; }); h+=`</div>`; }
      if(!n&&!(p.k==="OY"&&oyShow())) h+=`<div class="lane"></div>`;
      h+=`</div></div>`;
    });
  });
  el.innerHTML=h+`</div></div></div>`;
  el.querySelectorAll(".ev[data-oc]").forEach(b=>b.onclick=()=>{ if(!dragged) openOcc(+b.dataset.oc); });
  el.querySelectorAll(".ev[data-kh]").forEach(b=>b.onclick=()=>{ if(!dragged) openKh(KH[+b.dataset.kh]); });
  const sc=document.getElementById("tlScroll"); dragScroll(sc);
  if(inRange) sc.scrollLeft=Math.max(0,pct(todayN)/100*trackW-120);
}
let dragged=false;
function dragScroll(sc){ let down=false,sx=0,sl=0;
  sc.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse") return; down=true; dragged=false; sx=e.clientX; sl=sc.scrollLeft; });
  window.addEventListener("pointermove",e=>{ if(!down) return; const dx=e.clientX-sx; if(Math.abs(dx)>4){ dragged=true; sc.classList.add("drag"); } sc.scrollLeft=sl-dx; });
  window.addEventListener("pointerup",()=>{ if(!down) return; down=false; sc.classList.remove("drag"); setTimeout(()=>dragged=false,0); });
}

/* ---------- views ---------- */
function setView(v){
  view=v; VIEWS.forEach(x=>document.getElementById(x+"View").hidden=x!==v);
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v));
  document.getElementById("panel").classList.toggle("show-m",v==="month");
  if(location.hash!=="#"+v) history.replaceState(null,"","#"+v);
  render(); renderPanel(); window.scrollTo(0,0);
}
function render(){ if(view==="month") renderMonth(); else if(view==="year") renderYear(); else renderTimeline(); }
window.addEventListener("hashchange",()=>{ const v=location.hash.slice(1); if(VIEWS.includes(v)&&v!==view) setView(v); });
buildNav(); buildFilters();
const sh=location.hash.slice(1); setView(VIEWS.includes(sh)?sh:"month");
if(inRange) setTimeout(goToday,350);
let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(render,150); });
document.fonts&&document.fonts.ready.then(render);
</script>
